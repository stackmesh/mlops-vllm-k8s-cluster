apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama-3-1-8b-instruct
  namespace: inference
  labels:
    app.kubernetes.io/name: vllm-llama-3-1-8b-instruct
    app.kubernetes.io/part-of: mlops-vllm-k8s-cluster
    app.kubernetes.io/component: llm
    mlops.stackmesh/quant: awq
    mlops.stackmesh/strategy: mig
  annotations:
    mlops.stackmesh/reason: Placed 1 replica of llama-3.1-8b-instruct (awq) via mig
      4g.20gb on 1 physical GPU, 19.5 GiB reserved. Checkpoint meta-llama/Meta-Llama-3.1-8B-Instruct
      is the unquantized repo; set the AWQ checkpoint before apply.
    mlops.stackmesh/reserved-vram-gib: '19.50'
    mlops.stackmesh/pools: node-a
    mlops.stackmesh/repo-matches-quant: 'false'
    mlops.stackmesh/cross-node: 'false'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-llama-3-1-8b-instruct
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-llama-3-1-8b-instruct
        app.kubernetes.io/part-of: mlops-vllm-k8s-cluster
        app.kubernetes.io/component: llm
        mlops.stackmesh/quant: awq
        mlops.stackmesh/strategy: mig
      annotations:
        mlops.stackmesh/reason: Placed 1 replica of llama-3.1-8b-instruct (awq) via
          mig 4g.20gb on 1 physical GPU, 19.5 GiB reserved. Checkpoint meta-llama/Meta-Llama-3.1-8B-Instruct
          is the unquantized repo; set the AWQ checkpoint before apply.
        mlops.stackmesh/reserved-vram-gib: '19.50'
        mlops.stackmesh/pools: node-a
        mlops.stackmesh/repo-matches-quant: 'false'
        mlops.stackmesh/cross-node: 'false'
    spec:
      priorityClassName: inference-latency
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.32.0
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - meta-llama/Meta-Llama-3.1-8B-Instruct
        - --served-model-name
        - llama-3.1-8b-instruct
        - --tensor-parallel-size
        - '1'
        - --pipeline-parallel-size
        - '1'
        - --gpu-memory-utilization
        - '0.9000'
        - --max-model-len
        - '4096'
        - --max-num-seqs
        - '16'
        - --dtype
        - auto
        - --quantization
        - awq
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '2'
            memory: 16Gi
            nvidia.com/mig-4g.20gb: '1'
          limits:
            cpu: '4'
            memory: 24Gi
            nvidia.com/mig-4g.20gb: '1'
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
