apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: inference
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: mlops-vllm-k8s-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: mlops-vllm-k8s-cluster
        app.kubernetes.io/component: registry
    spec:
      priorityClassName: inference-batch
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.19.0
          command: ["python", "-m", "mlflow"]
          args:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /mlflow
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: inference
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
