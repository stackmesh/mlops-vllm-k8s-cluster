apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: inference
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: mlops-vllm-k8s-cluster
    app.kubernetes.io/component: vector
spec:
  serviceName: qdrant-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: mlops-vllm-k8s-cluster
        app.kubernetes.io/component: vector
    spec:
      priorityClassName: inference-batch
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: inference
  labels:
    app.kubernetes.io/name: qdrant
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: inference
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
