apiVersion: v1
kind: LimitRange
metadata:
  name: inference-container-limits
  namespace: inference
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "8"
        memory: 64Gi
