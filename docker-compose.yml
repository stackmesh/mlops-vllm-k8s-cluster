services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    entrypoint: ["python", "-m", "mlflow"]
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EMBEDDING_BACKEND: python
      MLOPS_CONFIG_DIR: /app/configs
    depends_on:
      - qdrant
      - mlflow
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.32.0
    runtime: nvidia
    ports:
      - "8000:8000"
    command:
      - --model
      - TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.90"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mlflow: {}
